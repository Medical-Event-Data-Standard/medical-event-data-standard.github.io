# Configuration for the Papers page (/papers), which lists papers that cite the MEDS papers below.
#
# The list is built from Semantic Scholar's citation graph when the site is built (see plugins/papers.ts), so
# new citing papers appear without anyone editing this file. Edit it to change which papers are listed:
#
#   seeds:   the core MEDS papers. Every paper citing at least one of them is listed. `id` is the paper's
#            Semantic Scholar paperId (the 40-character hash at the end of its semanticscholar.org URL);
#            `label` is the short name shown on the chips of the papers that cite it. If Semantic Scholar's
#            details of a seed are wrong, set any of `title`, `authors`, `venue`, `year` and `url` to show
#            those instead.
#   include: papers that use MEDS but cite none of the seeds, so would otherwise be missing.
#   exclude: papers that cite a seed but are not about using MEDS, e.g. ones mentioning it only in passing.
#
# `include` and `exclude` entries identify a paper by `id`: its Semantic Scholar paperId, `DOI:<doi>` or
# `ARXIV:<arXiv id>`. Add a `note` saying why, for reviewers. For example:
#
#   include:
#     - id: 'ARXIV:2401.00001'
#       note: 'Trains on MIMIC-IV converted with MEDS-Transforms, but does not cite the MEDS papers.'
#   exclude:
#     - id: 'DOI:10.1234/example'
#       note: 'Survey that mentions MEDS only in passing.'
#
# After changing the seeds or `include`, refresh the committed fallback snapshot with `npm run papers:update`.

seeds:
