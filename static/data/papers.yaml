# Configuration for the Papers page (/papers), which lists papers that cite the MEDS papers below.
#
# The list is built from Semantic Scholar's citation graph when the site is built (see plugins/papers.ts), so
# new citing papers appear without anyone editing this file. The institutions shown for each paper are its
# authors' affiliations on OpenAlex, also fetched at build time. Edit this file to change which papers are
# listed:
#
#   seeds:        the core MEDS papers. Every paper citing at least one of them is listed. `id` is the paper's
#                 Semantic Scholar paperId (the 40-character hash at the end of its semanticscholar.org URL);
#                 `label` is the short name shown on its card and in the "Why listed" filter. If Semantic
#                 Scholar's details of a seed are wrong, set any of `title`, `authors`, `venue`, `year` and
#                 `url` to show those instead.
#   include:      papers that use MEDS but cite none of the seeds, so would otherwise be missing.
#   exclude:      papers that cite a seed but are not about using MEDS, e.g. ones mentioning it only in passing.
#   affiliations: the institutions of listed papers that OpenAlex has no (or wrong) affiliations for, taken from
#                 the papers themselves; they replace OpenAlex's. Use OpenAlex's name for an institution where it
#                 has one (search https://api.openalex.org/institutions?search=<name>), so that its papers are
#                 counted together.
#
# `include`, `exclude` and `affiliations` entries identify a paper by `id`: its Semantic Scholar paperId,
# `DOI:<doi>` or `ARXIV:<arXiv id>`. Add a `note` saying why, for reviewers. An `include` entry can also set
# `title`, `authors`, `venue`, `year` and `url`, shown instead of Semantic Scholar's; with a `title`, a paper that
# Semantic Scholar doesn't have (yet) is listed from these details. For example:
#
#   include:
#     - id: 'ARXIV:2401.00001'
#       note: 'Trains on MIMIC-IV converted with MEDS-Transforms, but does not cite the MEDS papers.'
#     - id: 'DOI:10.1234/thesis'
#       note: 'Not on Semantic Scholar.'
#       title: 'A Thesis Using MEDS'
#       authors: ['Ada Lovelace']
#       venue: 'PhD thesis, University of Example'
#       year: 2026
#   exclude:
#     - id: 'DOI:10.1234/example'
#       note: 'Survey that mentions MEDS only in passing.'
#   affiliations:
#     - id: 'ARXIV:2401.00001'
#       note: 'From the author list of the arXiv PDF; OpenAlex has no affiliations for it.'
#       institutions: ['Stanford University', 'Columbia University']
#
# After changing the seeds, `include` or `affiliations`, refresh the committed fallback snapshot with
# `npm run papers:update`.

