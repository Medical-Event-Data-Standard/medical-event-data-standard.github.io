tools:
  name: 'Tools'
  description: 'Tools/packages for working with MEDS datasets across various AI tasks'
  icon: 'Build'

  core:
    name: 'MEDS Core'
    description: 'Core components of the MEDS ecosystem, including the schema and fundamental utilities.'
    packages:
      - name: 'MEDS Schema'
        pypi_name: 'meds'
        github_repo: 'Medical-Event-Data-Standard/meds'

  preprocessing:
    name: 'Preprocessing'
    description: 'Tools for preprocessing EHR data that is in the MEDS format or for building custom ETLs.'
    packages:
      - name: 'MEDS-Reader'
        pypi_name: 'meds-reader'
        github_repo: 'som-shahlab/meds_reader'
        docs_url: 'https://meds-reader.readthedocs.io'
      - name: 'MEDS Transforms'
        pypi_name: 'MEDS-Transforms'
        github_repo: 'mmcdermott/MEDS_transforms'
        docs_url: 'https://meds-transforms.readthedocs.io'
      - name: 'MEDS TorchData'
        pypi_name: 'meds-torch-data'
        github_repo: 'mmcdermott/meds-torch-data'
        docs_url: 'https://meds-torch-data.readthedocs.io'

  exploration:
    name: 'Exploration and Visualization'
    description: 'Tools for exploring, visualizing, and understanding MEDS datasets.'
    packages:
      - name: 'MEDS-Inspect'
        pypi_name: 'MEDS-Inspect'
        github_repo: 'rvandewater/MEDS-Inspect'
      - name: 'suMEDS'
        pypi_name: 'suMEDS'
        github_repo: 'rvandewater/suMEDS'
        docs_url: 'https://www.rpvandewater.com/suMEDS/'
      - name: 'MEDS Summary Stats'
        pypi_name: 'meds_summary_stats'
        github_repo: 'Medical-Event-Data-Standard/meds_summary_stats'
      - name: 'MEDS Visualizations'
        github_repo: 'mmcdermott/MEDS_visualizations'

  task_extraction:
    name: 'Task Extraction'
    description: 'Tools for extracting prediction task cohorts from MEDS datasets.'
    packages:
      - name: 'ACES'
        paper_url: 'https://openreview.net/forum?id=P4XmKjXTrM'
        pypi_name: 'es-aces'
        github_repo: 'justin13601/ACES'
        docs_url: 'https://eventstreamaces.readthedocs.io'
      - name: 'MEDS Random Task Sampler'
        pypi_name: 'meds-random-task-sampler'
        github_repo: 'florian6973/meds-random-task-sampler'
      - name: 'ehrlint'
        github_repo: 'DanPalBCM/ehrlint'

  modeling:
    name: 'Modeling'
    description: 'Libraries for building, training, and serializing models over MEDS datasets.'
    packages:
      - name: 'MEDS-Torch'
        paper_url: 'https://openreview.net/forum?id=uwnK2LZtjX'
        pypi_name: 'meds-torch'
        github_repo: 'Oufattole/meds-torch'
        docs_url: 'https://meds-torch.readthedocs.io'
      - name: 'FEMR'
        pypi_name: 'femr'
        github_repo: 'som-shahlab/femr'
      - name: 'MEDS to CEHR'
        github_repo: 'knatarajan-lab/meds_to_cehr'
      - name: 'meds2text'
        paper_url: 'https://arxiv.org/abs/2503.04176'
        github_repo: 'VISTA-Stanford/meds2text'
      - name: 'TwinWeaver'
        paper_url: 'https://arxiv.org/abs/2601.20906'
        pypi_name: 'twinweaver'
        github_repo: 'MendenLab/TwinWeaver'
        docs_url: 'https://mendenlab.github.io/TwinWeaver/'

  model_evaluation:
    name: 'Model Evaluation'
    description: 'Tools for evaluating models trained on MEDS datasets.'
    packages:
      - name: 'meds-evaluation'
        pypi_name: 'meds-evaluation'
        github_repo: 'kamilest/meds-evaluation'

  testing:
    name: 'Testing'
    description: 'Utilities and fixtures for testing MEDS pipelines and generating sample datasets.'
    packages:
      - name: 'MEDS Testing Helpers'
        pypi_name: 'meds_testing_helpers'
        github_repo: 'Medical-Event-Data-Standard/meds_testing_helpers'
        docs_url: 'https://meds-testing-helpers.readthedocs.io'

  semantic_web:
    name: 'Semantic Web'
    description: 'Ontologies and converters for representing MEDS data as linked data.'
    packages:
      - name: 'MEDS Ontology'
        github_repo: 'TeamHeKA/meds-ontology'
        docs_url: 'https://teamheka.github.io/meds-ontology'
      - name: 'MEDS2RDF'
        github_repo: 'TeamHeKA/meds2rdf'

dataset_etls:
  name: 'Dataset ETLs'
  description: 'Publicly available ETL pipelines for converting EHR datasets into the MEDS format.'
  icon: 'Storage'

  templates_and_tools:
    name: 'ETL Templates/Tools'
    description: 'Template ETLs or tools to build your own custom ETLs.'

    packages:
      - name: 'ETL Template'
        github_repo: 'Medical-Event-Data-Standard/ETL_MEDS_Template'
      - name: 'MEDS-ETL'
        github_repo: 'Medical-Event-Data-Standard/meds_etl'
        warn: '_Use for the MIMIC dataset is deprecated_!'
      - name: 'MEDS Extract'
        pypi_name: 'MEDS-extract'
        github_repo: 'mmcdermott/MEDS_extract'
      - name: 'EHR2Trace'
        pypi_name: 'ehr2trace'
        paper_url: 'https://arxiv.org/abs/2609.38193'
        github_repo: 'Yangxinyee/ehr2trace'
      - name: 'WeavEHR'
        pypi_name: 'weavehr'
        github_repo: 'aidh-ms/WeavEHR'
        docs_url: 'https://github.com/aidh-ms/WeavEHR/wiki'
      - name: 'EHR2MEDS'
        github_repo: 'FGA-DIKU/ehr2meds'
      - name: 'MESSY Synth'
        github_repo: 'mmcdermott/MESSY_synth'

  publicly_available_datasets:
    name: 'Public Datasets'
    description: 'ETLs for datasets that are open for public use (subject to DUA and license agreements).'

    datasets:
      - name: 'MIMIC-IV Demo'
        physionet_repo: https://physionet.org/content/mimic-iv-demo-meds/0.0.1/

    packages:
      - name: 'MIMIC-IV'
        demo_available: true
        pypi_name: 'MIMIC-IV-MEDS'
        github_repo: 'Medical-Event-Data-Standard/MIMIC_IV_MEDS'
      - name: 'AUMCdb'
        demo_available: false
        pypi_name: 'AUMCdb_MEDS'
        github_repo: 'prockenschaub/AUMCdb_MEDS'
      - name: 'NWICU'
        demo_available: false
        pypi_name: 'NWICU_MEDS'
        github_repo: 'rvandewater/NWICU_MEDS'
      - name: 'SICdb'
        demo_available: false
        pypi_name: 'SICdb_MEDS'
        github_repo: 'rvandewater/SICdb_MEDS'
      - name: 'INSPIRE'
        demo_available: false
        pypi_name: 'INSPIRE_MEDS'
        github_repo: 'rvandewater/INSPIRE_MEDS'
      - name: 'eICU'
        demo_available: true
        pypi_name: 'eICU_MEDS'
        github_repo: 'Medical-Event-Data-Standard/eICU_MEDS'
      - name: 'HiRID'
        demo_available: false
        pypi_name: 'HiRID_MEDS'
        github_repo: 'rvandewater/HIRID_MEDS'
      - name: 'CDSL'
        demo_available: false
        pypi_name: 'CDSL-MEDS'
        github_repo: 'rvandewater/CDSL_MEDS'
      - name: 'ALOTT'
        demo_available: false
        pypi_name: 'ALOTT-MEDS'
        github_repo: 'rvandewater/ALOTT_MEDS'
      - name: 'PIC'
        demo_available: false
        pypi_name: 'PICdb-MEDS'
        github_repo: 'rvandewater/PICdb_MEDS'
      - name: 'Zigong'
        demo_available: false
        pypi_name: 'Zigong-MEDS'
        github_repo: 'rvandewater/Zigong_MEDS'
      - name: 'EHRSHOT'
        demo_available: false
        paper_url: 'https://arxiv.org/abs/2307.02028'
        github_repo: 'som-shahlab/ehrshot-benchmark'
        docs_url: 'https://som-shahlab.github.io/ehrshot-website/'
        warn: '_Distributed natively in MEDS (`EHRSHOT_MEDS.zip` on Redivis); no ETL needed._'

  other_standards:
    name: 'Alternate Data Standards'
    description: 'ETLs for converting from other EHR data standards (e.g., OMOP).'
    packages:
      - name: 'OMOP (via MEDS-ETL)'
        github_repo: 'Medical-Event-Data-Standard/meds_etl'
        pypi_name: 'meds-etl'
      - name: 'OMOP (via dedicated OMOP_MEDS)'
        github_repo: 'rvandewater/OMOP_MEDS'
        pypi_name: 'OMOP-MEDS'
      - name: 'FHIR'
        github_repo: 'rvandewater/FHIR_MEDS'
        pypi_name: 'fhir2meds'

models:
  name: 'Published Models'
  description: 'Publicly available, reproducible model training recipes you can use on your MEDS data.'
  icon: 'ModelTraining'

  packages:
    - name: 'CEHR-BERT'
      paper_url: 'https://proceedings.mlr.press/v158/pang21a.html'
      github_repo: 'cumc-dbmi/cehrbert'
      pypi_name: 'cehrbert'
      MEDS_DEV_name: 'cehrbert'
    - name: 'MEDS-Tab'
      paper_url: ' https://arxiv.org/abs/2411.00200'
      github_repo: 'mmcdermott/MEDS_Tabular_AutoML'
      pypi_name: 'meds-tab'
      MEDS_DEV_name: 'meds_tab'
    - name: 'GenHPF'
      paper_url: 'https://ieeexplore.ieee.org/document/10298642'
      github_repo: 'hoon9405/GenHPF'
      pypi_name: 'genhpf'
      MEDS_DEV_name: 'genhpf'
    - name: 'EHR-RAGp'
      paper_url: 'https://arxiv.org/abs/2605.12335'
      github_repo: 'nyuad-cai/EHR-RAGp'
    - name: 'CEHR-GPT'
      paper_url: 'https://arxiv.org/abs/2402.04400'
      github_repo: 'knatarajan-lab/cehrgpt'
      pypi_name: 'cehrgpt'
    - name: 'MOTOR'
      paper_url: 'https://arxiv.org/abs/2301.03150'
      github_repo: 'som-shahlab/femr'
      pypi_name: 'femr'
      docs_url: 'https://huggingface.co/StanfordShahLab/motor-t-base'
      warn: '_Reads MEDS v0.3; pretrained weights are gated (CC-BY-NC 4.0)._'
    - name: 'CLMBR-T-base'
      paper_url: 'https://arxiv.org/abs/2307.02028'
      github_repo: 'som-shahlab/ehrshot-benchmark'
      docs_url: 'https://huggingface.co/StanfordShahLab/clmbr-t-base'
      warn: '_Pretrained weights are gated (CC-BY-NC 4.0)._'
    - name: 'Context Clues'
      paper_url: 'https://arxiv.org/abs/2412.16178'
      github_repo: 'som-shahlab/hf_ehr'
      pypi_name: 'hf-ehr'
      docs_url: 'https://huggingface.co/collections/StanfordShahLab/context-clues-6757f893f6a2918c7ab809f1'
      warn: '_Pretrained weights are gated (CC-BY-NC 4.0)._'
    - name: 'ETHOS'
      paper_url: 'https://arxiv.org/abs/2502.06124'
      github_repo: 'ipolharvard/ethos-ares'
    - name: 'MEDS-EIC-AR'
      github_repo: 'mmcdermott/MEDS_EIC_AR'
      pypi_name: 'MEDS-EIC-AR'
    - name: 'EveryQuery'
      paper_url: 'https://arxiv.org/abs/2603.07900'
      github_repo: 'payalchandak/EveryQuery'
      pypi_name: 'EveryQuery'
    - name: 'BONSAI'
      paper_url: 'https://doi.org/10.21105/joss.08869'
      github_repo: 'FGA-DIKU/BONSAI'
