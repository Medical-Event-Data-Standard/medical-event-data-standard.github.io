# The main MEDS papers, shown on a timeline on the "Welcome to MEDS" page (docs/intro_pages/1_intro.mdx), drawn by
# src/components/MedsPapersTimeline. The home page (src/pages/index.tsx) also features one of them, picked by its
# label in src/components/FeaturedPaper.
#
# List the papers on the standard itself and on its core tools and benchmark once they are published at a venue: a
# journal, conference or workshop. Papers that are only preprints (e.g. on arXiv) are left out until then. ACES
# (ICLR 2025) is left out on purpose. The timeline sorts the papers by date, so they can be listed in any order.
# Each paper has:
#
#   label:   short name shown on the timeline, e.g. 'MEDS-DEV'
#   title:   full title, as published
#   venue:   where it was published
#   year:    when it was published: for a journal, the date of publication; for a conference or workshop, the
#            date of the meeting
#   month:   optional; the month (1-12) of that date
#   url:     link to the paper: its DOI, the publisher's page or, for papers published there, its OpenReview page
#   pmc_url: optional; link to its free full text on PubMed Central, which the featured paper links to as well
#   summary: one line on what the paper is
#   id:      optional; the paper's Semantic Scholar paperId
#   authors: optional; the authors' full names, in order, as published (e.g. as Crossref lists them for a DOI);
#            the paper featured on the home page needs them, as it names its first authors
#
# `label`, `title`, `authors`, `venue`, `year`, `url` and `id` mean the same as in the seeds of
# static/data/papers.yaml.

papers:
  - label: 'MEDS'
    title: 'Medical Event Data Standard (MEDS): Facilitating Machine Learning for Health'
    venue: 'ICLR 2024 Workshop on Learning from Time Series for Health'
    year: 2024
    month: 5
    url: 'https://openreview.net/forum?id=IsHy2ebjIG'
    summary: 'Introduces MEDS, a minimal schema for machine learning on electronic health record data.'
    id: '5c9dd4ea7e027ada78e0567a78bba86cecee68d0'

  - label: 'MEDS-Torch'
    # "Pipleine" is how the workshop's listing (https://nips.cc/virtual/2024/103000) spells the title.
    title: 'MEDS-torch: An ML Pipleine for Inductive Experiments for EHR Medical Foundation Models'
    venue: 'NeurIPS 2024 Workshop on Time Series in the Age of Large Models'
    year: 2024
    month: 12
    url: 'https://openreview.net/forum?id=uwnK2LZtjX'
    summary: 'A modelling pipeline for MEDS datasets, used to compare tokenization and transfer-learning methods.'

  - label: 'MEDS-DEV'
    # Peer-reviewed (single-blind), non-archival ML4H 2024 Demo Track paper, per its OpenReview record; the ML4H site
    # (https://ahli.cc/ml4h/2024/call-for-demonstrations/) describes the track. The symposium was 15-16 Dec 2024.
    # Its Semantic Scholar record has the right title but garbled authors, which is why static/data/papers.yaml
    # excludes it as a citing paper.
    title: 'MEDS Decentralized, Extensible Validation (MEDS-DEV) Benchmark: Establishing Reproducibility and Comparability in ML for Health'
    venue: 'ML4H 2024 (demo track)'
    year: 2024
    month: 12
    url: 'https://openreview.net/forum?id=DExp3tRRel'
    summary: 'A community benchmark for reproducible, comparable evaluation of models across MEDS datasets and tasks.'
    id: '7d56d69d5864c28e45d6cc3f8e8b802f666c7ecf'

  - label: 'MEDS tutorial'
    title: 'MEDS: Building Models and Tools in a Reproducible Health AI Ecosystem'
    venue: 'KDD 2025 (tutorial)'
    year: 2025
    month: 8
    url: 'https://doi.org/10.1145/3711896.3737608'
    summary: 'A hands-on tutorial: convert data to MEDS, build models, and benchmark them with MEDS-DEV.'
    id: '2619008e94a623872a48eeb05da7e0a4a97e2ed5'

  - label: 'MEDS review'
    # Featured on the home page. Title, venue, date and authors as Crossref has them for the DOI (vol. 3, no. 6).
    title: 'MEDS — An Emerging Data Standard and Ecosystem for Health AI Research'
    authors:
