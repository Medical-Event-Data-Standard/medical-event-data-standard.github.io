# Which `meds_summary_stats` files the "Dataset statistics" page (docs/intro_pages/3_dataset_statistics.mdx) shows.
# See plugins/etlSummaryStats.ts for how they are collected.
#
# Every package under `dataset_etls` in static/data/ecosystem.yaml that has a `github_repo` is searched
# automatically, on its default branch, for committed files named `*summary_stats*.json`, so a new ETL appears on
# the page as soon as it commits one. A file whose name contains "demo" is treated as a demo dataset. Use this file
# only for what that can't work out:
#
#   repos:        ETL repositories that aren't in ecosystem.yaml, and overrides for those that are. Each entry has a
#                 `github_repo` (owner/repo) and optionally a `label` (defaults to the ecosystem package name) and
#                 `files`: per-file overrides, keyed by the path in the repository, with a `label` and/or a
#                 `variant` (`full` or `demo`). A file listed here is shown even if its name doesn't match the
#                 pattern above.
#   exclude:      repositories (owner/repo) or single files (owner/repo/path/to/file.json) to leave out.
#   local_files:  stats files committed to this repository, for datasets whose stats no ETL repository publishes.
#                 Each entry has a `path` (relative to the repository root, conventionally under
#                 static/data/etl_summary_stats/), a `label`, and optionally a `variant` (`full` or `demo`; by
#                 default from the file name, as above). If the file's metadata/dataset.json doesn't name the
#                 dataset or its version usefully, `dataset_name` and `dataset_version` set what the page shows
#                 instead (a string; quote a number, e.g. '1.2'; or null to show none); the page marks them as
#                 set here. Say where they come from in a `note`.
#
# A `note` for reviewers is allowed in any entry and ignored.
#
# After editing this file, refresh the committed snapshot, which the dev server uses (see the plugin's comments).

repos:
  - github_repo: Medical-Event-Data-Standard/MIMIC_IV_MEDS
    files:
      tests/regression/full_summary_stats.json:
        label: MIMIC-IV
        variant: full
      tests/regression/demo_summary_stats.json:
        label: MIMIC-IV demo
        variant: demo

exclude: []

local_files:
  - path: static/data/etl_summary_stats/ehrshot_full_summary_stats.json
    label: EHRSHOT
    variant: full
    # The file's dataset_version (0.9:<ETL version>:OMOP_5.4) starts with OMOP_MEDS's default RAW_DATASET_VERSION,
    # 0.9, not with a version of EHRSHOT.
    dataset_name: EHRSHOT
    dataset_version: '3.2'
    note: >-
      Written by meds_summary_stats 0.0.4 (git tag 0.0.4) with the default suppression (min_cell_size 20,
      min_numeric_cell_size 20), from the same MEDS_transforms 0.6.7 build of EHRSHOT (MEDS 0.4.1) as the earlier
      0.0.3 file, whose values it repeats, adding per_subject.measurements_per_day. The version is
      EHRSHOT's current version on Redivis, v3.2 (https://stanford.redivis.com/datasets/53gc-8rhx41kgt,
      DOI 10.57761/0gv9-nd83; versions and release notes from
      https://redivis.com/api/v1/datasets/ShahLab.ehrshot/versions, checked 2026-11-10). The file's subject count
      equals the person table's row count in v3.0 to v3.2 only, and its Visit events outnumber all the
      visit_occurrence and visit_detail rows of v3.0 and v3.1, but not those of v3.2, whose release note is
      "Various fixes to OMOP tables".
  - path: static/data/etl_summary_stats/inspect_full_summary_stats.json
    # The file's dataset.json names INSPECT's source systems and their release dates, not INSPECT and its version,
    # so the label, name and version are set here.
    label: INSPECT
    variant: full
    dataset_name: INSPECT
    dataset_version: '1.2'
    note: >-
      Written by meds_summary_stats 0.0.4 (git tag 0.0.4) with the default suppression (min_cell_size 20,
      min_numeric_cell_size 20), from the same meds_etl.omop build of INSPECT (MEDS 0.3.3) as the earlier 0.0.3
      file, whose values it repeats, adding per_subject.measurements_per_day. The version is the current
      version of INSPECT EHR on Redivis, v1.2 (https://stanford.redivis.com/datasets/dzc6-9jyt6gapt,
      DOI 10.57761/ak51-d519; versions and release notes from
      https://redivis.com/api/v1/datasets/ShahLab.inspect_ehr/versions, checked 2026-11-10). Its MEDS files are
      those of v1.1 (the MEDS file index has the same hash in both versions; v1.2 only adds identifier mappings),
      uploaded on 2025-02-12. The file's ETL version, meds_etl 0.3.9.dev11 built on 2025-01-31, is later than
      v1.0's MEDS file index, created on 2024-12-10.
